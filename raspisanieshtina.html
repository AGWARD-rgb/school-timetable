:root{color-scheme:dark;--bg:#071426;--card:#10243c;--line:#284765;--text:#eff6ff;--muted:#9bb0c8;--blue:#75bdff;--mint:#8ce3c7}

esson{display:grid;grid-template-columns:45px 1fr auto;gap:13px;align-items:center;border:1px solid #284561;background:linear-gradient(110deg,#112944,#0c2036);border-radius:17px;padding:14px 16px}.number{height:42px;width:42px;border-radius:13px;background:#1b3d5c;color:#a8d9ff;display:grid;place-items:center;font-weight:900;font-size:18px}.subject{font-weight:800;font-size:16px}.sub{font-size:12px;color:var(--muted);margin-top:4px}.tag{font-size:12px;font-weight:750;color:#b8ddff;background:#173954;border:1px solid #315c7b;border-radius:10px;padding:7px 9px;white-space:nowrap}.tag.remote{color:var(--mint);background:#103b37;border-color:#28675d}.notice{border:1px dashed #355675;border-radius:17px;background:#0b1c30;padding:20px;color:var(--muted);text-align:center}.notice strong{display:block;color:var(--text);margin-bottom:5px}.foot{text-align:center;color:#728ba6;font-size:11px;margin-top:23px}
@media(max-width:540px){.wrap{padding:17px 12px 35px}.hero{padding:19px}.lesson{grid-template-columns:42px 1fr;gap:10px;padding:13px}.number{width:39px;height:39px}.tag{grid-column:2;justify-self:start}.status{max-width:100px;text-align:right}}

<script>
const API='https://script.google.com/macros/s/AKfycbxYE_an26zextigB83aefvv275aWFJjB-aZY2JQVjn9PuORhZQ1o4D6L8oZ5GqkTMng9Q/exec';
const $=id=>document.getElementById(id);let rows=[],classes=[],activeDay=0,activeGrade='',activeLetter='';
const txt=v=>String(v??'').replace(/\s+/g,' ').trim();
function isGrade(v){return /^[5-9]|^(10|11)$/.test(txt(v))}
function classFromCell(v){let m=txt(v).match(/^(5|6|7|8|9|10|11)\s*[-]?\s*([А-ЯЁA-Z])$/i);return m?{grade:m[1],letter:m[2].toUpperCase()}:null}
function scanClasses(data){
 let found=[];
 data.forEach((row,ri)=>row.forEach((v,ci)=>{
  let c=classFromCell(v);if(c)found.push({...c,row:ri,col:ci,mode:'combined'});
  if(isGrade(v)&&ci+1<row.length&&/^[А-ЯЁA-Z]$/i.test(txt(row[ci+1])))found.push({grade:txt(v),letter:txt(row[ci+1]).toUpperCase(),row:ri,col:ci,mode:'split'});
 }));
 const seen=new Set();return found.filter(x=>{let k=x.grade+x.letter;if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>+a.grade-+b.grade||a.letter.localeCompare(b.letter,'ru'));
}
function headerRows(data){
 return data.map((row,i)=>({i,row,text:row.map(txt).filter(Boolean).join(' ')}))
   .filter(x=>/расписан|понедельник|вторник|сред|четверг|пятниц|суббот/i.test(x.text));
}
function findClassBlocks(data, grade, letter){
 const found=[];
 data.forEach((row,ri)=>{
  row.forEach((v,ci)=>{
   const c=classFromCell(v);
   if(c && c.grade===grade && c.letter===letter) found.push({grade,letter,row:ri,col:ci,mode:'combined'});
   else if(txt(v)===grade && ci+1<row.length && txt(row[ci+1]).toUpperCase()===letter)
    found.push({grade,letter,row:ri,col:ci,mode:'split'});
  });
 });
 const seen=new Set();
 return found.filter(x=>{const k=x.row+':'+x.col;if(seen.has(k))return false;seen.add(k);return true})
   .sort((a,b)=>a.row-b.row);
}
function getBlockHeading(data, cl){
 const weekday=/понедельник|вторник|среда|среду|четверг|пятниц|суббот/i;
 for(let r=cl.row;r>=Math.max(0,cl.row-12);r--){
  const row=data[r]||[];
  const candidates=[];
  row.forEach((v,c)=>{
   const t=txt(v);
   if(t && (/расписан/i.test(t)||weekday.test(t))) candidates.push({t,c});
  });
  if(candidates.length){
   candidates.sort((a,b)=>Math.abs(a.c-cl.col)-Math.abs(b.c-cl.col));
   let title=candidates[0].t;
   const day=(title.match(/понедельник|вторник|среда|среду|четверг|пятниц[ауы]?|суббот[ауы]?/i)||[])[0]||'';
   const date=(title.match(/\b\d{1,2}[./-]\d{1,2}(?:[./-]\d{2,4})?\b/)||[])[0]||'';
   if(day||date) return [day?day.charAt(0).toUpperCase()+day.slice(1):'',date].filter(Boolean).join(' · ');
   return title.replace(/Расписание уроков на/i,'').replace(/\(Удаленное обучение\)/i,'').trim();
  }
 }
 return 'Расписание';
}
function detectBlockLessons(data, cl){
 const startCol=cl.col;
 const subjectCol=cl.col;
 const day=getBlockHeading(data,cl);
 const lessons=[];
 for(let r=cl.row+1;r<data.length;r++){
  const row=data[r]||[];
  const next=classFromCell(row[startCol]);
  const splitNext=txt(row[startCol]) && /^\d{1,2}$/.test(txt(row[startCol])) &&
      row[startCol+1] && /^[А-ЯЁA-Z]$/i.test(txt(row[startCol+1]));
  if(next||splitNext) break;
  let subject=txt(row[subjectCol]),room=txt(row[subjectCol+1]);
  if(!subject && cl.mode==='split'){subject=txt(row[startCol+1]);room=txt(row[startCol+2]);}
  if(!subject)continue;
  if(subject.length>90||/^(понедельник|вторник|среда|четверг|пятница|суббота)$/i.test(subject))continue;
  // Ignore a repeated section title or empty spacer rows.
  if(/расписание уроков/i.test(subject))continue;
  const number=txt(row[0]);
  lessons.push({number:/^\d{1,2}$/.test(number)?number:String(lessons.length+1),subject,room});
 }
 return {day,lessons};
}
function getClassSchedules(data, grade, letter){
 return findClassBlocks(data,grade,letter)
  .map(block=>({...block,...detectBlockLessons(data,block)}))
  .filter(block=>block.lessons.length>0);
}
function render(){
 const g=$('grade').value,l=$('letter').value;activeGrade=g;activeLetter=l;
 $('days').innerHTML='';
 if(!g||!l){
  $('mainTitle').textContent='Расписание уроков';
  $('dayTitle').textContent='Выберите класс';$('total').textContent='';
  $('list').innerHTML='<div class="notice"><strong>Класс не выбран</strong>Выберите класс и букву, чтобы посмотреть расписание уроков.</div>';
  return;
 }
 $('mainTitle').textContent=`Расписание уроков для ${g} «${l}» класса`;
 const schedules=getClassSchedules(rows,g,l);
 if(!schedules.length){
  $('dayTitle').textContent='Расписание не найдено';$('total').textContent='';
  $('list').innerHTML='<div class="notice"><strong>Для выбранного класса пока нет заполненного расписания</strong></div>';
  return;
 }
 $('dayTitle').textContent='Расписание';$('total').textContent=`${schedules.length} ${schedules.length===1?'день':'дня'}`;
 $('list').innerHTML=schedules.map((data,index)=>{
  const cards=data.lessons.map(x=>{
   const remote=/эпос/i.test(x.room);
   const label=remote?'💻 ЭПОС · дистанционно':x.room?'🚪 Кабинет '+x.room:'Кабинет не указан';
   return `<article class="lesson"><div class="number">${x.number}</div><div><div class="subject">${x.subject}</div><div class="sub">Урок ${x.number}</div></div><div class="tag ${remote?'remote':''}">${label}</div></article>`;
  }).join('');
  return `<section class="schedule-day"><div class="heading"><h2>${data.day||`День ${index+1}`}</h2><span>${data.lessons.length} уроков</span></div><div class="list">${cards}</div></section>`;
 }).join('');
}
function fill(){
 classes=scanClasses(rows);
 const grades=[...new Set(classes.map(x=>x.grade))].sort((a,b)=>+a-+b);
 $('grade').innerHTML='<option value="">Выбери класс</option>'+grades.map(x=>`<option value="${x}">${x} класс</option>`).join('');
 if(grades.includes('7'))$('grade').value='7';
 updateLetters();
}
function updateLetters(){
 let g=$('grade').value,letters=[...new Set(classes.filter(x=>x.grade===g).map(x=>x.letter))].sort((a,b)=>a.localeCompare(b,'ru'));
 $('letter').innerHTML='<option value="">Выбери букву</option>'+letters.map(x=>`<option value="${x}">${x}</option>`).join('');
 if(letters.length===1)$('letter').value=letters[0];render();
}
function requestData(){
 return new Promise((resolve,reject)=>{
  const callback='scheduleCallback_'+Date.now()+'_'+Math.floor(Math.random()*100000);
  const script=document.createElement('script');
  const timer=setTimeout(()=>{cleanup();reject(new Error('Сервер не ответил. Проверь публикацию веб-приложения.'));},15000);
  function cleanup(){clearTimeout(timer);delete window[callback];script.remove();}
  window[callback]=(obj)=>{cleanup();resolve(obj);};
  script.onerror=()=>{cleanup();reject(new Error('Не удалось открыть адрес Google Apps Script.'));};
  script.src=API+'?callback='+callback+'&t='+Date.now();
  document.body.appendChild(script);
 });
}
async function load(){
 $('status').textContent='Загружаем данные…';
