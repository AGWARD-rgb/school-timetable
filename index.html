<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Электронное расписание школы</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 340px;
            text-align: center; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .modal-content h2 { color: #1a73e8; margin-top: 0; margin-bottom: 20px; font-size: 22px; }
        .modal-content input {
            width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc;
            border-radius: 6px; font-size: 15px; box-sizing: border-box;
        }
        .modal-content input:focus { border-color: #34a853; outline: none; }
        .error-msg { color: #d93025; font-size: 14px; margin-bottom: 10px; display: none; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 20px; cursor: pointer; color: #999; }
        .admin-footer { margin-top: 20px; text-align: right; }
        .loading-banner { text-align: center; color: #666; font-size: 16px; margin: 20px 0; }
    </style>
</head>
<body>

    <!-- НАСТРОЙКА АВТОМАТИЧЕСКОГО СОХРАНЕНИЯ НА GITHUB -->
    <script>
        // ВНИМАТЕЛЬНО ВСТАВЬТЕ СВОЙ ЛОГИН GITHUB В КАВЫЧКАХ:
        const GH_USER = "AGWARD-rgb"; 
        const GH_REPO = "school-timetable"; 
        const GH_TOKEN = "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"; 
    </script>

    <!-- ОКНО АВТОРИЗАЦИИ (МОДАЛЬНОЕ) -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <span id="close-modal-btn" class="close-btn">&times;</span>
            <h2>🔐 Вход для учителя</h2>
            <div id="error-text" class="error-msg">Неверный логин или пароль!</div>
            <input type="text" id="username-field" placeholder="Логин">
            <input type="password" id="password-field" placeholder="Пароль">
            <button id="login-submit-btn" class="btn" style="background-color: #34a853; color: white; width: 100%;">Войти</button>
        </div>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС САЙТА -->
    <div class="container">
        <h1>🏫 Расписание уроков</h1>
        
        <div class="controls-row">
            <div class="select-box">
                <label for="class-select">Выберите класс: </label>
                <select id="class-select" disabled>
                    <option value="">-- Загрузка базы... --</option>
                </select>
            </div>
            <button id="open-login-btn" class="btn" style="background-color: #1a73e8; color: white;">Войти как учитель</button>
            <button id="logout-btn" class="btn btn-cancel hidden">Выйти из режима редактора</button>
        </div>

        <div id="loading-text" class="loading-banner">🔄 Синхронизация расписания с сервером...</div>
        <div id="schedule-display" class="schedule-grid"></div>

        <!-- Панель администратора -->
        <div id="admin-panel" class="admin-panel hidden" style="border-top: 3px dashed #34a853; padding-top: 20px;">
            <h2 id="admin-title">Редактирование расписания</h2>
            <div id="editor-container"></div>
            <div id="admin-footer-block" class="admin-footer hidden">
                <button id="save-btn" class="btn btn-save" style="background-color: #34a853; color: white;">💾 Сохранить изменения в облако</button>
            </div>
        </div>
    </div>

    <script>
        const DAYS_OF_WEEK = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];

        function generateDefaultSchedule() {
            const defaultData = {};
            for (let grade = 5; grade <= 9; grade++) {
                ["А", "Б", "В", "Г"].forEach(letter => {
                    const className = `${grade}${letter}`;
                    defaultData[className] = {};
                    DAYS_OF_WEEK.forEach(day => {
                        defaultData[className][day] = ["", "", "", "", "", "", "", ""];
                    });
                });
            }
            return defaultData;
        }

        let schoolData = generateDefaultSchedule();

        const classSelect = document.getElementById('class-select');
        const scheduleDisplay = document.getElementById('schedule-display');
        const openLoginBtn = document.getElementById('open-login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const loginModal = document.getElementById('login-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const loginSubmitBtn = document.getElementById('login-submit-btn');
        const usernameField = document.getElementById('username-field');
        const passwordField = document.getElementById('password-field');
        const errorText = document.getElementById('error-text');
        const adminPanel = document.getElementById('admin-panel');
        const adminTitle = document.getElementById('admin-title');
        const editorContainer = document.getElementById('editor-container');
        const saveBtn = document.getElementById('save-btn');
        const adminFooterBlock = document.getElementById('admin-footer-block');
        const loadingText = document.getElementById('loading-text');
        // ЧТЕНИЕ С СЕРВЕРА GITHUB
        function loadScheduleFromGitHub() {
            fetch('data.json?cache_bust=' + Date.now()) 
            .then(res => res.json())
            .then(resData => {
                if (resData && Object.keys(resData).length > 0) {
                    schoolData = resData;
                }
                
                Object.keys(schoolData).forEach(className => {
                    if (typeof schoolData[className] === 'object') {
                        DAYS_OF_WEEK.forEach(day => {
                            if (!schoolData[className][day]) schoolData[className][day] = ["", "", "", "", "", "", "", ""];
                            while(schoolData[className][day].length < 8) schoolData[className][day].push("");
                        });
                    }
                });

                buildClassSelect();
                loadingText.classList.add('hidden');
                classSelect.removeAttribute('disabled');
                checkAuth();
            })
            .catch(err => {
                console.log("Создаем чистый шаблон...");
                schoolData = generateDefaultSchedule();
                buildClassSelect();
                loadingText.classList.add('hidden');
                classSelect.removeAttribute('disabled');
                checkAuth();
            });
        }

        function buildClassSelect() {
            classSelect.innerHTML = '<option value="">-- Выберите из списка --</option>';
            Object.keys(schoolData).sort((a, b) => parseInt(a) - parseInt(b) || a.localeCompare(b)).forEach(className => {
                if (typeof schoolData[className] === 'object') {
                    const option = document.createElement('option');
                    option.value = className; option.textContent = className;
                    classSelect.appendChild(option);
                }
            });
        }

        function renderSchedule(className) {
            scheduleDisplay.innerHTML = '';
            if (!className || !schoolData[className]) return;
            const days = schoolData[className];
            Object.keys(days).forEach(dayName => {
                const dayCard = document.createElement('div');
                dayCard.className = 'day-card';
                let lessonsHtml = `<h3>${dayName}</h3><ol>`;
                days[dayName].forEach(lesson => { lessonsHtml += `<li>${lesson}</li>`; });
                lessonsHtml += '</ol>';
                dayCard.innerHTML = lessonsHtml;
                scheduleDisplay.appendChild(dayCard);
            });
        }

        function renderEditor(className) {
            editorContainer.innerHTML = '';
            if (!className) {
                adminTitle.textContent = "Выберите класс в списке выше, чтобы начать редактирование";
                adminFooterBlock.classList.add('hidden');
                return;
            }
            adminTitle.textContent = `⚙️ Редактирование расписания: ${className} класс`;
            adminFooterBlock.classList.remove('hidden');

            const days = schoolData[className];
            Object.keys(days).forEach(dayName => {
                const dayBlock = document.createElement('div');
                dayBlock.className = 'editor-day-block';
                dayBlock.innerHTML = `<h4>${dayName}</h4>`;
                days[dayName].forEach((lesson, index) => {
                    const inputRow = document.createElement('div');
                    inputRow.className = 'input-row';
                    inputRow.innerHTML = `
                        <span>Урок ${index + 1}:</span>
                        <input type="text" class="lesson-input" data-day="${dayName}" data-index="${index}" value="${lesson}" placeholder="Пусто">
                    `;
                    dayBlock.appendChild(inputRow);
                });
                editorContainer.appendChild(dayBlock);
            });
        }

        classSelect.addEventListener('change', (e) => {
            renderSchedule(e.target.value);
            if (sessionStorage.getItem('isAdmin') === 'true') { renderEditor(e.target.value); }
        });

        openLoginBtn.addEventListener('click', () => { loginModal.style.display = 'flex'; });
        closeModalBtn.addEventListener('click', () => { loginModal.style.display = 'none'; errorText.style.display = 'none'; });
        
        loginSubmitBtn.addEventListener('click', () => {
            if (usernameField.value.trim() === "Teacher" && passwordField.value.trim() === "gimnazium_five555") {
                sessionStorage.setItem('isAdmin', 'true');
                loginModal.style.display = 'none';
                checkAuth();
            } else {
                errorText.style.display = 'block'; passwordField.value = '';
            }
        });

        logoutBtn.addEventListener('click', () => { sessionStorage.removeItem('isAdmin'); checkAuth(); });

        function checkAuth() {
            if (sessionStorage.getItem('isAdmin') === 'true') {
                openLoginBtn.classList.add('hidden'); logoutBtn.classList.remove('hidden');
                adminPanel.classList.remove('hidden'); renderEditor(classSelect.value);
            } else {
                openLoginBtn.classList.remove('hidden'); logoutBtn.classList.add('hidden');
                adminPanel.classList.add('hidden'); editorContainer.innerHTML = '';
            }
        }

        // АВТОМАТИЧЕСКОЕ СОХРАНЕНИЕ ЧЕРЕЗ API GITHUB
        saveBtn.addEventListener('click', () => {
            const currentClass = classSelect.value;
            if (!currentClass) return;

            saveBtn.textContent = "⏳ Минутку, сохраняю в базу...";
            saveBtn.setAttribute('disabled', 'true');

            const inputs = document.querySelectorAll('.lesson-input');
            inputs.forEach(input => {
                const day = input.getAttribute('data-day');
                const index = parseInt(input.getAttribute('data-index'));
                schoolData[currentClass][day][index] = input.value.trim();
            });

            const url = `https://github.com{GH_USER}/${GH_REPO}/contents/data.json`;

            fetch(url, { headers: { 'Authorization': `token ${GH_TOKEN}` } })
            .then(res => res.json())
            .then(fileInfo => {
                const sha = fileInfo.sha;
                const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(schoolData, null, 2))));

                return fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GH_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Авто-обновление расписания класса ${currentClass}`,
                        content: updatedContent,
                        sha: sha
                    })
                });
            })
            .then(res => {
                if (res.ok) {
                    alert(`🎉 Расписание успешно обновлено в облаке! Изменения применились для всей школы.`);
                } else {
                    alert("⚠️ Не удалось сохранить. Проверьте правильность токена и логина в коде.");
                }
                saveBtn.textContent = "💾 Сохранить изменения в облако";
                saveBtn.removeAttribute('disabled');
                renderSchedule(currentClass);
            })
            .catch(err => {
                console.error(err);
                alert("Ошибка соединения с сервером GitHub.");
                saveBtn.textContent = "💾 Сохранить изменения в облако";
                saveBtn.removeAttribute('disabled');
            });
        });

        passwordField.addEventListener('keypress', (e) => { if (e.key === 'Enter') loginSubmitBtn.click(); });

        loadScheduleFromGitHub();
    </script>
</body>
</html>
