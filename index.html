       <script>
        const GH_USER = "AGWARD-rgb"; 
        const GH_REPO = "school-timetable"; 
        
        // Переменная для хранения расшифрованного токена во время сессии
        let GH_TOKEN = ""; 

        // ФУНКЦИЯ ДЛЯ БЕЗОПАСНОГО ДЕКОДИРОВАНИЯ ТОКЕНА ПО ПАРОЛЮ
        function decryptToken(enteredPassword) {
            // ВНИМАНИЕ: Замените строку ниже на ваш НОВЫЙ токен, предварительно закодировав его в Base64
            // (Чтобы получить строку ниже, зайдите на сайт b64.ru, вставьте ваш токен ghp_... и скопируйте результат)
            const encrypted = "Z2hwX25ld1Rva2VuRXhhbXBsZVN0cmluZ0RvTm90Q29weXRoaXNfXw=="; 
            
            try {
                // Если пароль верный (например, Школа2026), убираем защиту и возвращаем токен
                if (enteredPassword === "Школа2026") { 
                    return atob(encrypted); 
                }
            } catch(e) { console.error(e); }
            return null;
        }

        const DAYS_OF_WEEK = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];

        function generateDefaultSchedule() {
            const defaultData = {};
            for (let grade = 5; grade <= 9; grade++) {
                ["А", "Б", "В", "Г"].forEach(letter => {
                    const className = `${grade}${letter}`;
                    defaultData[className] = {};
                    DAYS_OF_WEEK.forEach(day => {
                        defaultData[className][day] = ["", "", "", "", "", "", "", ""];
                    });
                });
            }
            return defaultData;
        }

        let schoolData = generateDefaultSchedule();

        const classSelect = document.getElementById('class-select');
        const scheduleDisplay = document.getElementById('schedule-display');
        const openLoginBtn = document.getElementById('open-login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const loginModal = document.getElementById('login-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const loginSubmitBtn = document.getElementById('login-submit-btn');
        const passwordField = document.getElementById('password-field');
        const errorText = document.getElementById('error-text');
        const adminPanel = document.getElementById('admin-panel');
        const adminTitle = document.getElementById('admin-title');
        const editorContainer = document.getElementById('editor-container');
        const saveBtn = document.getElementById('save-btn');
        const adminFooterBlock = document.getElementById('admin-footer-block');
        const loadingText = document.getElementById('loading-text');

        function loadScheduleFromGitHub() {
            fetch('data.json?cache_bust=' + Date.now()) 
            .then(res => res.json())
            .then(resData => {
                if (resData && Object.keys(resData).length > 0) {
                    schoolData = resData;
                }
                buildClassSelect();
                loadingText.style.display = 'none';
                classSelect.removeAttribute('disabled');
            })
            .catch(err => {
                schoolData = generateDefaultSchedule();
                buildClassSelect();
                loadingText.style.display = 'none';
                classSelect.removeAttribute('disabled');
            });
        }

        function buildClassSelect() {
            classSelect.innerHTML = '<option value="">-- Выберите из списка --</option>';
            Object.keys(schoolData).sort((a, b) => parseInt(a) - parseInt(b) || a.localeCompare(b)).forEach(className => {
                const option = document.createElement('option');
                option.value = className; option.textContent = className;
                classSelect.appendChild(option);
            });
        }

        // ОТКРЫТИЕ ОКНА ВХОДА
        openLoginBtn.addEventListener('click', () => {
            loginModal.style.display = 'flex';
            errorText.style.display = 'none';
            passwordField.value = '';
        });

        closeModalBtn.addEventListener('click', () => {
            loginModal.style.display = 'none';
        });

        // ЛОГИКА СВЕРКИ ПАРОЛЯ И ОТКРЫТИЯ РЕДАКТОРА
        loginSubmitBtn.addEventListener('click', () => {
            const pass = passwordField.value.trim();
            const decrypted = decryptToken(pass);

            if (decrypted) {
                GH_TOKEN = decrypted; // Токен успешно расшифрован и готов к работе
                loginModal.style.display = "none";
                
                // Переключаем видимость кнопок вручную через style, чтобы не зависеть от CSS классов
                openLoginBtn.style.display = 'none';
                logoutBtn.style.display = 'inline-block';
                logoutBtn.classList.remove('hidden');
                
                // Показываем панель редактора
                adminPanel.style.display = 'block';
                adminPanel.classList.remove('hidden');
                adminFooterBlock.style.display = 'block';
                adminFooterBlock.classList.remove('hidden');
                
                alert("🔓 Доступ разрешен! Выберите класс выше, чтобы начать редактирование.");
                if (classSelect.value) renderEditor(classSelect.value);
            } else {
                errorText.style.display = "block";
            }
        });

        // СЛУШАТЕЛЬ СМЕНЫ КЛАССА В ВЫПАДАЮЩЕМ СПИСКЕ
        classSelect.addEventListener('change', () => {
            const selectedClass = classSelect.value;
            renderSchedule(selectedClass);
            // Если мы вошли как админ, то при смене класса сразу открываем его для редактирования
            if (GH_TOKEN && selectedClass) {
                renderEditor(selectedClass);
            }
        });

        // ФУНКЦИЯ ОТРИСОВКИ ДЛЯ ПРОСМОТРА
        function renderSchedule(className) {
            scheduleDisplay.innerHTML = '';
            if (!className || !schoolData[className]) return;
            const days = schoolData[className];
            Object.keys(days).forEach(dayName => {
                const dayCard = document.createElement('div');
                dayCard.className = 'day-card';
                let lessonsHtml = `<h3>${dayName}</h3><ol>`;
                days[dayName].forEach(lesson => { lessonsHtml += `<li>${lesson || "-"}</li>`; });
                lessonsHtml += '</ol>';
                dayCard.innerHTML = lessonsHtml;
                scheduleDisplay.appendChild(dayCard);
            });
        }

        // ФУНКЦИЯ ГЕНЕРАЦИИ ПОЛЕЙ ДЛЯ РЕДАКТИРОВАНИЯ РАСПИСАНИЯ
        function renderEditor(className) {
            editorContainer.innerHTML = '';
            adminTitle.textContent = `Редактирование расписания для: ${className}`;
            const days = schoolData[className];

            Object.keys(days).forEach(dayName => {
                const dayDiv = document.createElement('div');
                dayDiv.style.marginBottom = '20px';
                dayDiv.innerHTML = `<h4>${dayName}</h4>`;
                
                days[dayName].forEach((lesson, index) => {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.value = lesson;
                    input.placeholder = `Урок ${index + 1}`;
                    input.style.margin = '4px';
                    input.style.width = '85%';
                    
                    // Сохраняем изменения в память при вводе текста учителем
                    input.addEventListener('input', (e) => {
                        schoolData[className][dayName][index] = e.target.value;
                    });
                    dayDiv.appendChild(input);
                });
                editorContainer.appendChild(dayDiv);
            });
        }

        logoutBtn.addEventListener('click', () => {
            GH_TOKEN = "";
            location.reload();
        });

        // АВТОМАТИЧЕСКАЯ ОТПРАВКА ДАННЫХ РОБОТУ GITHUB
        saveBtn.addEventListener('click', () => {
            if (!GH_TOKEN) {
                alert("Ошибка: Сессия истекла. Пожалуйста, войдите снова.");
                return;
            }

            saveBtn.disabled = true;
            saveBtn.style.backgroundColor = '#666';
            saveBtn.textContent = "⏳ Робот обновляет облако...";

            fetch(`https://github.com{GH_USER}/${GH_REPO}/dispatches`, {
                method: 'POST',
                headers: {
                    'Authorization': `token ${GH_TOKEN}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    event_type: 'update-json',
                    client_payload: {
                        schedule_data: JSON.stringify(schoolData, null, 2)
                    }
                })
            })
            .then(response => {
                if (response.ok) {
                    alert("🎉 Изменения отправлены роботу! Файл обновится на GitHub через 15 секунд. Страница перезагрузится.");
                    setTimeout(() => location.reload(), 4000);
                } else {
                    throw new Error("Не удалось сохранить. Проверьте права вашего токена.");
                }
            })
            .catch(err => {
                alert("❌ Ошибка отправки: " + err.message);
                saveBtn.disabled = false;
                saveBtn.style.backgroundColor = '#34a853';
                saveBtn.textContent = "💾 Сохранить изменения в облако";
            });
        });

        loadScheduleFromGitHub();
    </script>
</body>
</html>
